<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <!-- Kicked / Banned overlay -->
  <div id="action-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div id="overlay-icon"  class="overlay-icon"></div>
      <h2  id="overlay-title"></h2>
      <p   id="overlay-desc"></p>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <rect width="48" height="48" rx="14" fill="#6366f1"/>
          <path d="M10 14h28a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H14l-6 4V16a2 2 0 0 1 2-2z" fill="white"/>
        </svg>
      </div>
      <h1>เข้าร่วม Chat</h1>
      <p class="subtitle">กรอกชื่อเล่นเพื่อเริ่มแชทได้เลย ไม่ต้องสมัครสมาชิก</p>

      <form id="login-form">
        <div class="input-group">
          <label for="nickname-input">ชื่อเล่น</label>
          <input id="nickname-input" type="text" placeholder="เช่น เอ, บี, ซี..."
            maxlength="20" autocomplete="off" autofocus />
        </div>

        <div id="error-msg" class="error-msg hidden"></div>

        <button type="submit" id="join-btn">เข้าร่วม</button>

        <div class="admin-toggle-wrap">
          <button type="button" id="admin-toggle">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            เข้าใช้แบบ Admin
          </button>
        </div>

        <div id="admin-key-group" class="input-group hidden">
          <label for="adminkey-input">Admin Key</label>
          <input id="adminkey-input" type="password" placeholder="กรอก Admin Key..."
            autocomplete="off" />
        </div>
      </form>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen" class="screen hidden">
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="room-badge">
          <span class="hash">#</span>
          <span>global</span>
        </div>
        <button id="leave-btn" title="ออกจากห้อง">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-scroll">
        <div class="online-section">
          <div class="section-label">ออนไลน์ — <span id="online-count">0</span></div>
          <ul id="user-list"></ul>
        </div>

        <div id="banned-section" class="hidden">
          <div class="section-label banned-label">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10"/>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
            แบนแล้ว — <span id="banned-count">0</span>
          </div>
          <ul id="banned-list"></ul>
        </div>
      </div>
    </aside>

    <main id="chat-main">
      <div id="messages"></div>

      <div id="typing-bar" class="hidden">
        <span id="typing-text"></span>
        <span class="dots"><span></span><span></span><span></span></span>
      </div>

      <form id="message-form">
        <input id="message-input" type="text" placeholder="พิมพ์ข้อความ..."
          maxlength="500" autocomplete="off" />
        <button type="submit" id="send-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
